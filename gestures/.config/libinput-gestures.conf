# Gestos do touchpad estilo macOS (libinput-gestures). Precisa do grupo input
# 4 dedos pra cima: todas as janelas (Mission Control) | pra baixo: desktops. O terminal suspenso fica de fora
gesture swipe up    4 skippy-xd --expose --toggle --wm-class '!scratchpad'
gesture swipe down  4 skippy-xd --paging --toggle --wm-class '!scratchpad'

# 4 dedos pros lados: troca de desktop, como no Mac (dedos pra esquerda = desktop da direita)
gesture swipe left  4 bspc desktop -f next.local
gesture swipe right 4 bspc desktop -f prev.local
