; Menubar estilo macOS: fina, translúcida (o picom faz o blur atrás), Catppuccin Mocha
[colors]
background = #B31E1E2E
background-alt = #313244
foreground = #CDD6F4
dim = #7F849C
primary = #CBA6F7
alert = #F38BA8
transparent = #00000000

[bar/minhabarra]
monitor = ${env:MONITOR:}
width = 100%
height = 28
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "Inter:style=Medium:size=10;3"
font-1 = "Inter:style=Bold:size=10;3"
font-2 = "Symbols Nerd Font:size=11;3"
font-3 = "Symbols Nerd Font:size=7;2"

modules-left = menu bspwm title
modules-right = ${env:TRAY:} pulseaudio battery date

padding-left = 1
padding-right = 2
module-margin = 1
separator = " "
wm-restack = bspwm
locale = pt_BR.UTF-8
cursor-click = pointer


[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 60%

[module/menu]
type = custom/text
content = ""
content-font = 3
content-foreground = ${colors.foreground}
content-padding = 1
click-left = ~/.local/bin/power-menu &

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = false

; Pontinhos: roxo no ativo, cheio se tem janela, vazado se vazio
label-focused = "󰝥"
label-focused-font = 4
label-focused-foreground = ${colors.primary}
label-focused-padding = 1
label-occupied = "󰝥"
label-occupied-font = 4
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-urgent = "󰝥"
label-urgent-font = 4
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-empty = "󰝦"
label-empty-font = 4
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

; Nome do app em foco, como no menu do Mac
[module/title]
type = internal/xwindow
format-padding = 1
label = %class%
label-font = 2
label-maxlen = 40
label-empty = Área de trabalho
label-empty-font = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 3
label-muted = 󰝟
label-muted-font = 3
label-muted-foreground = ${colors.dim}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 5
full-at = 99
low-at = 15

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low> <label-low>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 100%
label-low = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
ramp-capacity-font = 3

animation-charging-0 = 󰢟
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂋
animation-charging-4 = 󰂅
animation-charging-font = 3
animation-charging-framerate = 750

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-font = 3
animation-low-foreground = ${colors.alert}
animation-low-framerate = 600

; "Qua 22 out  20:46" (clique alterna pra data completa)
[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %A, %d de %B
time-alt = %H:%M:%S
label = %date%   %time%
