[colors]
background = #1E1E2E
background-alt = #313244
foreground = #CDD6F4
primary = #CBA6F7
alert = #F38BA8

[bar/minhabarra]
width = 100%
height = 32
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "FiraCode Nerd Font:size=11;2"
font-1 = "FiraCode Nerd Font:size=14;3"

modules-left = bspwm
modules-center = date
modules-right = cpu memory battery pulseaudio

padding = 2
module-margin = 1
wm-restack = bspwm

# --- CONFIGURAÇÃO DA BANDEJA (FLAMESHOT E WI-FI) ---
tray-position = right
tray-padding = 2
tray-background = ${colors.background}

[module/bspwm]
type = internal/bspwm

# Ícones personalizados para os seus 5 espaços de trabalho
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-default = 

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-padding = 2

label-occupied = %icon%
label-occupied-foreground = #89B4FA
label-occupied-padding = 2

label-empty = %icon%
label-empty-foreground = #6C7086
label-empty-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d/%m/%Y %H:%M:%S
label = 󰃰 %date%
label-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕾 Vol: %percentage%%
label-muted = 󰖁 Mudo
label-muted-foreground = ${colors.alert}

[module/cpu]
type = internal/cpu
label =  CPU: %percentage%%

[module/memory]
type = internal/memory
label =  RAM: %percentage_used%%

[module/battery]
type = internal/battery

# O nome da sua bateria e adaptador. (Geralmente são BAT0 e ACAD, ou BAT1 e AC)
battery = BAT0
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-full = 󰁹 100%
label-full-foreground = ${colors.primary}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰢟
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂋
animation-charging-4 = 󰂅
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750
