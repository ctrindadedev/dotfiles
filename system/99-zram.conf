# /etc/sysctl.d/99-zram.conf: ajustes recomendados pra swap em zram
# (os mesmos do Fedora/Pop!_OS). Swap na RAM é barato, então pode usar mais cedo
vm.swappiness = 180
# Lê uma página por vez do swap (readahead não ajuda em zram)
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
