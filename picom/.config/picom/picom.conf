# --- Backend (Usa a Placa de Vídeo para fluidez) ---
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# --- Bordas Arredondadas ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

# --- Sombras ---
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.4;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'menu'",
    "class_i = 'mpv-bg-edp'",
    "class_i = 'mpv-bg-hdmi'"
];

# --- Desfoque (Blur) ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_i = 'mpv-bg-edp'",
    "class_i = 'mpv-bg-hdmi'"
];

# --- Animações Básicas (Fading) ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

wintypes:
{
  desktop = { shadow = false; blur-background = false; opacity = 1.0; };
};
